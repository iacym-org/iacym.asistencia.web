name: Build & Push Docker image

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/iacym-org/iacym-asistencia:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Redeploy stack via Portainer
        env:
          PORTAINER_TOKEN: ${{ secrets.PORTAINER_API_TOKEN }}
        run: |
          BASE="https://portainer.jvtechsolution.com"
          STACK_ID=7
          ENDPOINT_ID=3
          FILE=$(curl -sf -H "X-API-Key: $PORTAINER_TOKEN" "$BASE/api/stacks/$STACK_ID/file")
          STACK=$(curl -sf -H "X-API-Key: $PORTAINER_TOKEN" "$BASE/api/stacks/$STACK_ID")
          CONTENT=$(echo "$FILE" | jq -r '.StackFileContent')
          ENV=$(echo "$STACK" | jq '.Env')
          curl -sf -X PUT \
            -H "X-API-Key: $PORTAINER_TOKEN" \
            -H "Content-Type: application/json" \
            "$BASE/api/stacks/$STACK_ID?endpointId=$ENDPOINT_ID" \
            -d "$(jq -n --arg c "$CONTENT" --argjson e "$ENV" '{stackFileContent: $c, env: $e, pullImage: true}')"
